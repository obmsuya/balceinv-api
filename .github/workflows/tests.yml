name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: balce
          POSTGRES_PASSWORD: balce_ci_only
          POSTGRES_DB: balce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U balce -d balce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test on SQLite and Postgres
        env:
          TEST_DATABASE_URL: postgres://balce:balce_ci_only@127.0.0.1:5432/balce?sslmode=disable
        run: |
          go vet ./...
          go test ./... -count=1
