services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: balce
      POSTGRES_PASSWORD: balce_dev_only
      POSTGRES_DB: balce
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - balce_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balce"]
      interval: 2s
      timeout: 3s
      retries: 20

  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "127.0.0.1:53900:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - balce_dev_garage:/var/lib/garage

volumes:
  balce_dev_postgres:
  balce_dev_garage:
