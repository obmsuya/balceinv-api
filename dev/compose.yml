services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: balce
      POSTGRES_PASSWORD: balce_dev_only
      POSTGRES_DB: balce
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - balce_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balce"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  balce_dev_postgres:
