name: balce

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: balce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      BALCE_OWNER_PASSWORD: ${BALCE_OWNER_PASSWORD:?}
      BALCE_APP_PASSWORD: ${BALCE_APP_PASSWORD:?}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
      - -c
      - log_min_duration_statement=500
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - balce_internal
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d balce"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: balce-garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - balce_internal
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  api:
    image: balce-api:${BALCE_API_TAG:?}
    container_name: balce-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://balce_app:${BALCE_APP_PASSWORD:?}@postgres:5432/balce?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://balce_owner:${BALCE_OWNER_PASSWORD:?}@postgres:5432/balce?sslmode=disable
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?}
      PROXY_HEADER: CF-Connecting-IP
      TRUSTED_PROXIES: 172.31.250.1
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: balce-media
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      BALCE_SUPPORT_PASSCODE_HASH: ${BALCE_SUPPORT_PASSCODE_HASH:-}
      SUPPORT_SMTP_PASSWORD: ${SUPPORT_SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api_logs:/var/log/balce
    networks:
      - balce_internal
      - balce_edge
    mem_limit: 192m
    logging: *default-logging

networks:
  balce_internal:
    internal: true
  balce_edge:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1

volumes:
  api_logs:
  postgres_data:
  garage_meta:
  garage_data:
